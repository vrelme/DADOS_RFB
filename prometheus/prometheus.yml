global:
  scrape_interval: 15s
  evaluation_interval: 15s

scrape_configs:
  - job_name: "rfb-loader-enterprise"
    static_configs:
      - targets:
          - "rfb-metrics-api:8000"

  - job_name: "node-exporter"
    static_configs:
      - targets:
          - "node-exporter:9100"

  - job_name: "mysql-exporter"
    static_configs:
      - targets:
          - "mysql-exporter:9104"

  # Use this target when the metrics API is running directly on Windows.
  - job_name: "rfb-loader-enterprise-host"
    static_configs:
      - targets:
          - "host.docker.internal:8000"
